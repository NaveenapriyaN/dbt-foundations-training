models:
  - name: stg_nations
    columns:
      - name: nation_id
        data_tests:
          - unique
          - not_null

  - name: stg_regions
    columns:
      - name: name
        data_tests:
          - accepted_values:
              arguments:
                values: ['AFRICA', 'ASIA', 'EUROPE', 'AMERICA']
              config:
                store_failures: true

  - name: stg_orders
    description: Order Information Table
    columns:
      - name: total_price
        data_tests:
          - order_values:
              description: Testing Order Values
              arguments: 
                val: 880
              config:     
                store_failures: true
