models:
  - name: stg_nations
    description: "Nation information table"
    columns:
      - name: nation_id
        data_tests:
          - unique
          - not_null

  - name: stg_regions
    description: "Region Informations table"
    columns:
      - name: name
        data_tests:
          - accepted_values:
              arguments:
                values: ['AFRICA', 'ASIA', 'EUROPE', 'AMERICA', 'MIDDLE EAST']
              config:
                store_failures: true

  - name: stg_orders
    description: "Order Information Table"
    columns:
      - name: total_price
        data_tests:
          - order_values:
              arguments:
                val: "{{ var('v_min_order') }}"
              config:     
                store_failures: true
